bookdown::gitbook:
  css: style.css
  config:
    self_contained: true
    output_dir: "docs"
    toc:
      before: |
        <li><a href="./">R Basic Course</a></li>
      after: |
        <li><a href="https://mauromardones.github.io/Course_R_Statictics/" target="_blank">Published with bookdown</a></li>
    edit: "https://github.com/mauromardones/Course_R_Statictics/main/%s"
    download: ["pdf", "epub"]
    collapse_section: true

bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  number_sections: true
  pandoc_args: ["--top-level-division=chapter"]
  keep_tex: yes
  linkcolor: blue

bookdown::epub_book:
  keep_md: true

